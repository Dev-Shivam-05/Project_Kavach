# The eight day-one gates (§3.2), plus protolint (9), the env-var doc check (10)
# and — as a separate job — the Kotlin compile that no dev machine here can run.
# Each is a separate named step, so a red build says which invariant broke
# without anyone opening a log.
#
# Every gate step carries `if: ${{ !cancelled() }}` deliberately: a gate failing
# must not hide the state of the others. These are properties, not a pipeline —
# knowing that three of them are red is worth more than knowing the first one is.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: eight day-one gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # The backend is stdlib-only and has no go.sum; setup-go's built-in
          # cache keys on one and fails the step when it is missing. The module
          # cache is still worth keeping — staticcheck's install populates it.
          cache: false

      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('backend/go.mod') }}
          restore-keys: go-${{ runner.os }}-

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      # ── Gate 1 ───────────────────────────────────────────────────────────────
      - name: 'Gate 1a — go vet'
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go vet ./...

      - name: 'Gate 1b — staticcheck (FAILS the build if it cannot be installed)'
        if: ${{ !cancelled() }}
        working-directory: backend
        # @latest rather than a pin: staticcheck releases track Go releases, and a
        # pin here is a pin to a version that may not parse the language version
        # we compile with. Until 6 Sep an install failure was a warning and
        # `exit 0`, so a green build did not prove staticcheck ran (RISK S2.5).
        # staticcheck is one of only three static-analysis surfaces this repo
        # has; a day the module proxy is down is a red build, not a quiet skip.
        run: |
          if ! go install honnef.co/go/tools/cmd/staticcheck@latest; then
            echo "::error title=Gate 1b staticcheck NOT RUN::staticcheck could not be installed, so it did NOT run. A green Gate 1b must mean staticcheck ran — this is a failed gate, not a skipped one. Re-run the job; if the install keeps failing, pin a version that parses Go $(go env GOVERSION)."
            exit 1
          fi
          "$(go env GOPATH)/bin/staticcheck" ./...

      # ── Gate 2 ───────────────────────────────────────────────────────────────
      - name: 'Gate 2 — go test -race'
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          # -race needs cgo. ubuntu-latest defaults CGO_ENABLED=1, but a runner
          # image that changes that default would silently turn the race detector
          # off and the step would still pass.
          CGO_ENABLED: '1'
        run: go test ./... -race

      # ── Gate 3 ───────────────────────────────────────────────────────────────
      - name: 'Gate 3 — archlint: module boundaries (I-12, ADR-002)'
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go run ./tools/archlint

      # ── Gate 4 ───────────────────────────────────────────────────────────────
      - name: 'Gate 4 — sos-ingest LOC budget (ADR-002, ≤1000)'
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go test ./cmd/sos-ingest -run TestLOCBudget -v

      # ── Gate 5 ───────────────────────────────────────────────────────────────
      - name: 'Gate 5 — tsc --noEmit + mobile invariants (incl. I-2 ASCII SMS lint)'
        if: ${{ !cancelled() }}
        working-directory: mobile
        run: |
          npx tsc --noEmit
          npm test

      # ── Gate 6 ───────────────────────────────────────────────────────────────
      - name: 'Gate 6 — generated state machines are not stale'
        if: ${{ !cancelled() }}
        run: node tools/smgen.mjs --check

      # ── Gate 7 ───────────────────────────────────────────────────────────────
      - name: 'Gate 7 — PII deny-list is intact (I-6)'
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go test ./internal/logx -run 'TestDenyList|TestDevHandler|TestProdHandler' -v

      # ── Gate 8 ───────────────────────────────────────────────────────────────
      - name: 'Gate 8 — Class-A schema lint (I-3, A′ allowlist §2.4.6)'
        if: ${{ !cancelled() }}
        run: node tools/schema-lint.mjs

      # ── Gate 9 ───────────────────────────────────────────────────────────────
      # Not one of the eight; tools/protolint.mjs landed alongside them and a lint
      # that never runs is the failure mode this workflow exists to end.
      - name: 'Gate 9 — proto contract is additive-only (I-13, §8.4)'
        if: ${{ !cancelled() }}
        run: node tools/protolint.mjs

      # ── Gate 10 ──────────────────────────────────────────────────────────────
      # ops/README.md §5 is "the reference an operator is told to trust". It had
      # drifted from the binaries four variables deep by 6 Sep (RISK-adjacent,
      # ops-13). This keeps every KAVACH_* a Go binary reads on that table.
      - name: 'Gate 10 — every KAVACH_* the binaries read is in ops/README.md §5'
        if: ${{ !cancelled() }}
        run: node tools/envlint.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # ★ THE FIRST RUN OF A GATE THE DEV MACHINE CANNOT EXECUTE ★
  #
  # `mobile/modules/kavach-t0/android/` is the entire Tier-0 survival plane —
  # foreground service, Direct Boot receivers, KeyVault, silent multi-SIM SMS —
  # and until this job it was checked by NOTHING that compiles: the dev machine
  # has no Android SDK (D-021), `native-bridge.test.ts` compares names by regex,
  # and the nine gates above are Go, TypeScript and Node. A Kotlin file with a
  # syntax error could sit on `main` with every gate green.
  #
  # ubuntu-latest has a JDK and an Android SDK, so this job generates the android
  # project with `expo prebuild` and compiles the app's Kotlin — which links the
  # local module from source (`canBePublished false` in its build.gradle), so a
  # broken KavachT0Module.kt fails here. It is a SEPARATE job on purpose: the
  # nine day-one gates must keep reporting independently of a toolchain that has
  # never run against this repository before. If this job's first run is red for
  # toolchain reasons, fix the job — do not mark it continue-on-error, that is
  # the "gate that never runs" this workflow exists to end.
  #
  # Compile only, no APK: `compileReleaseKotlin` needs neither the JS bundle nor
  # the NDK, which keeps this to the question it can answer (does the Kotlin
  # compile) rather than the one EAS answers (does the build ship).
  # ───────────────────────────────────────────────────────────────────────────
  kotlin:
    name: 'Gate K — Tier-0 Kotlin compiles (UNVERIFIED LOCALLY — no Android SDK on the dev machine; this job is the first place it runs)'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the android project (expo prebuild — the same step EAS runs)
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        # --no-install: node_modules are already there and there is no pod step
        # on Android. `mobile/android/` is gitignored, so this is always a fresh
        # generation from app.json + the config plugins.
        run: npx expo prebuild --platform android --no-install

      - name: Compile the Kotlin (app + modules/kavach-t0, linked from source)
        working-directory: mobile/android
        run: ./gradlew :app:compileReleaseKotlin --no-daemon --console=plain
